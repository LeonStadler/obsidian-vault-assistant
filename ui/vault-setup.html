<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Obsidian Vault Setup</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; color: CanvasText; background: Canvas; }
      main { max-width: 680px; padding: 22px; }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { color: color-mix(in srgb, CanvasText 68%, transparent); line-height: 1.45; }
      .status { border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 8px; padding: 14px; margin: 18px 0; }
      .status strong { display: block; margin-bottom: 6px; }
      label { display: block; margin: 16px 0 7px; font-weight: 600; }
      textarea { box-sizing: border-box; width: 100%; min-height: 78px; resize: vertical; border: 1px solid color-mix(in srgb, CanvasText 24%, transparent); border-radius: 6px; background: Canvas; color: CanvasText; padding: 10px; font: inherit; }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
      button { border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); border-radius: 6px; padding: 9px 14px; background: color-mix(in srgb, CanvasText 9%, Canvas); color: CanvasText; font: inherit; cursor: pointer; }
      button.primary { border-color: #0f766e; background: #0f766e; color: white; }
      button:disabled { cursor: not-allowed; opacity: 0.55; }
      .message { min-height: 22px; margin-top: 14px; color: color-mix(in srgb, CanvasText 70%, transparent); }
    </style>
  </head>
  <body>
    <main>
      <h1>Obsidian Vault verbinden</h1>
      <p>Wähle einen lokalen Vault und begrenze danach, welche Ordner für Retrieval zugänglich sind. Die Konfiguration bleibt lokal auf diesem Mac.</p>
      <section class="status" aria-live="polite">
        <strong id="status-title">Noch kein Vault ausgewählt</strong>
        <span id="status-path">Der MCP kann erst nach der Auswahl auf Vault-Notizen zugreifen.</span>
      </section>
      <label for="roots">Erlaubte Retrieval-Ordner</label>
      <textarea id="roots" placeholder="Ein relativer Ordner pro Zeile, zum Beispiel:&#10;Projects&#10;References"></textarea>
      <label for="excludes">Ausgeschlossene Ordner</label>
      <textarea id="excludes" placeholder="Ein relativer Ordner pro Zeile, zum Beispiel:&#10;.obsidian&#10;Archive"></textarea>
      <div class="actions">
        <button id="choose" type="button" disabled>Vault auswählen</button>
        <button id="save" class="primary" type="button" disabled>Konfiguration speichern</button>
      </div>
      <div id="message" class="message" role="status"></div>
    </main>
    <script>
      const pending = new Map();
      let nextId = 1;
      let configured = false;
      let ready = false;
      let busy = false;

      function updateButtons() {
        document.getElementById("choose").disabled = !ready || busy;
        document.getElementById("save").disabled = !ready || busy || !configured;
      }

      function request(method, params) {
        const id = nextId++;
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            pending.delete(id);
            reject(new Error(`Keine Antwort vom Host für ${method}. Öffne die Setup-Ansicht erneut.`));
          }, 120000);
          pending.set(id, { resolve, reject, timer });
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        });
      }

      function valuesFromTextarea(id) {
        return document.getElementById(id).value.split(/[\n,]/).map((value) => value.trim()).filter(Boolean);
      }

      function updateState(nextState) {
        if (!nextState || typeof nextState !== "object") return;
        configured = nextState.configured === true;
        document.getElementById("status-title").textContent = configured ? "Vault verbunden" : "Noch kein Vault ausgewählt";
        document.getElementById("status-path").textContent = configured ? nextState.vaultPath : "Der MCP kann erst nach der Auswahl auf Vault-Notizen zugreifen.";
        if (Array.isArray(nextState.retrievalRoots)) document.getElementById("roots").value = nextState.retrievalRoots.join("\n");
        if (Array.isArray(nextState.excludePaths)) document.getElementById("excludes").value = nextState.excludePaths.join("\n");
        updateButtons();
      }

      function handleResult(result) {
        if (!result?.isError) updateState(result?.structuredContent);
        const text = result?.content?.[0]?.text;
        if (text) document.getElementById("message").textContent = text;
      }

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;
        if (message.id !== undefined && pending.has(message.id)) {
          const entry = pending.get(message.id);
          pending.delete(message.id);
          clearTimeout(entry.timer);
          if (message.error) entry.reject(message.error); else entry.resolve(message.result);
          return;
        }
        if (message.method === "ui/notifications/tool-result") handleResult(message.params);
      }, { passive: true });

      document.getElementById("choose").addEventListener("click", async () => {
        busy = true;
        updateButtons();
        document.getElementById("message").textContent = "Ordnerauswahl wird geöffnet …";
        try { handleResult(await request("tools/call", { name: "choose_vault", arguments: {} })); }
        catch (error) { document.getElementById("message").textContent = error.message || "Die Ordnerauswahl konnte nicht geöffnet werden."; }
        finally { busy = false; updateButtons(); }
      });

      document.getElementById("save").addEventListener("click", async () => {
        busy = true;
        updateButtons();
        document.getElementById("message").textContent = "Konfiguration wird gespeichert …";
        try {
          handleResult(await request("tools/call", {
            name: "save_vault_scope",
            arguments: { retrievalRoots: valuesFromTextarea("roots"), excludePaths: valuesFromTextarea("excludes") },
          }));
        } catch (error) { document.getElementById("message").textContent = error.message || "Die Konfiguration konnte nicht gespeichert werden."; }
        finally { busy = false; updateButtons(); }
      });

      request("ui/initialize", {
        appInfo: { name: "obsidian-vault-assistant", version: "0.5.3" },
        appCapabilities: {},
        protocolVersion: "2026-01-26",
      }).then(async () => {
        window.parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} }, "*");
        ready = true;
        updateButtons();
        handleResult(await request("tools/call", { name: "configure_vault", arguments: {} }));
      }).catch((error) => {
        document.getElementById("message").textContent = error.message || "Die Vault-Konfiguration konnte nicht geladen werden.";
      });
    </script>
  </body>
</html>
