interface:
  display_name: "Vault Enrichment"
  short_description: "Improve notes with durable context"
  default_prompt: "If setup is needed, call configure_vault on obsidianVaultFilesystem and do not use another Obsidian integration. Use $vault-enrichment with only the obsidianVaultFilesystem MCP to improve an Obsidian note with durable context, links, structure, and corrections."

policy:
  allow_implicit_invocation: true
