interface:
  display_name: "Vault Audit"
  short_description: "Find stale notes and broken links"
  default_prompt: "If setup is needed, call configure_vault on obsidianVaultFilesystem and do not use another Obsidian integration. Use $vault-audit with only the obsidianVaultFilesystem MCP to check my Obsidian vault for stale content, broken links, duplicate notes, and markdown drift."

policy:
  allow_implicit_invocation: true
